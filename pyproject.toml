[project]
name = "recsys"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "implicit>=0.7.3",
    "lightgbm>=4.7.0",
    "numpy>=2.5.5",
    "optuna>=5.1.0",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
    "threadpoolctl>=3.8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "C901", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 30
